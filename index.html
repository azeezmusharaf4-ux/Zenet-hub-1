<!doctype html>

    <!-- Google Fonts: Plus Jakarta Sans for crisp, razor-sharp mobile typography -->

    <!-- Critical Fallback Base Styles for Older Android WebViews & Slow Mobile Connections -->
    <style>

      html, body {

      }
      #root {
        width: 100%;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      img, svg, video {
        max-width: 100%;
        height: auto;
        display: block;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button, input, select, textarea {
